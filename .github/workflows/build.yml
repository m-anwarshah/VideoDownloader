name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APKs
        run: gradle assembleDebug

      - name: Show APK sizes
        run: ls -lh app/build/outputs/apk/debug/*.apk

      # Most phones from 2015 onward. Install this one.
      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-arm64
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk

      # Older 32-bit phones only
      - name: Upload arm32 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-arm32
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
