plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.manwar.videodownloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.manwar.videodownloader"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"

        // Build for 64-bit ARM only. Python, ffmpeg and aria2c are compiled
        // per-architecture, so including a second one would roughly double
        // the APK for binaries no single phone ever uses. arm64 covers
        // effectively every phone from 2015 onward.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packagingOptions {
        jniLibs {
            // yt-dlp needs the Python binary on disk, so extraction stays on
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // Debug key so CI output installs directly; swap in a real key
            // before putting this on the Play Store
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def ytdlp = "0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:library:$ytdlp"
    // ffmpeg merges separate video and audio streams — required for YouTube
    // above 720p
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$ytdlp"
    // aria2c is the speed accelerator (16 parallel connections)
    implementation "io.github.junkfood02.youtubedl-android:aria2c:$ytdlp"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    // Cards, chips, switches, text fields and the progress bar in the UI
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
